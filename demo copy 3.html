<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>n8n Workflow</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f0f0f0;
        }
        h2 {
            text-align: center;
        }
        iframe {
            display: block;
            margin: 20px auto;
            border: 1px solid #ccc;
        }
        button {
            display: block;
            margin: 20px auto;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <h2>n8n Workflow</h2>




    <h1>n8n</h1>
    <iframe src="http://localhost:5678/" style="height:600px;width:100%;"></iframe>


    <!-- Button to trigger webhook (you can customize the action) -->
    <button id="triggerWebhookButton">Trigger n8n Workflow</button>

    <script>
        // API Key for authenticating n8n requests
        const apiKey = 'n8n_api_fe47230be81cde1fdaa8893f498bddaa96b1a2752ef5278e6bcac0c82cda8ec42c7ecc3e21577dcc';  // Replace with your actual API key

        // Function to trigger the webhook when the button is clicked
        document.getElementById('triggerWebhookButton').addEventListener('click', function() {
            fetch('http://localhost:5678/webhook/47c193b6-988b-45af-b777-bff42ca01f3b', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-N8N-API-KEY': apiKey  // Use the API key in the header for authentication
                },
                body: JSON.stringify({
                    // Include any data you need to pass to the workflow
                    "key": "value"
                })
            })
            .then(response => response.json())
            .then(data => {
                console.log('Webhook triggered:', data);
            })
            .catch(error => {
                console.error('Error triggering webhook:', error);
            });
        });
    </script>

</body>
</html>
