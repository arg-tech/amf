<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script type="module" src="https://cdn.jsdelivr.net/npm/@n8n_io/n8n-demo-component/n8n-demo.bundled.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@webcomponents/webcomponentsjs@2.0.0/webcomponents-loader.js"></script>
  <script src="https://www.unpkg.com/lit@2.0.0-rc.2/polyfill-support.js"></script>
  <title>Workflow Selection</title>
  <style>
    /* Base Styles */
    body {
      font-family: 'Arial', sans-serif;
      background-color: #f1f1f1;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    h1 {
      text-align: center;
      color: #333;
      font-size: 2.5em;
      margin-top: 50px;
    }
    /* Workflow Selection */
    .workflow-selection {
      text-align: center;
      margin: 30px 0;
    }
    .workflow-selection label {
      margin: 0 15px;
      font-size: 1.2em;
      color: #555;
    }
    .workflow-selection input {
      margin-right: 10px;
      accent-color: #0066cc;
    }
    /* Workflow Containers */
    .workflow-container {
      display: none;
      margin-top: 30px;
      background-color: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }
    .workflow-container h2 {
      text-align: center;
      color: #444;
      font-size: 1.8em;
      margin-bottom: 20px;
    }
    /* Input Box */
    #inputBoxContainer {
      text-align: center;
      margin-top: 30px;
    }
    #userInput {
      padding: 10px;
      font-size: 1.2em;
      border: 2px solid #ddd;
      border-radius: 8px;
      width: 50%;
      max-width: 400px;
      outline: none;
      transition: border 0.3s ease;
    }
    #userInput:focus {
      border-color: #0066cc;
    }
    /* Button Styles */
    button {
      background-color: #0066cc;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 30px;
      font-size: 1.2em;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    button:hover {
      background-color: #005bb5;
    }
    /* Response Box */
    #webhookResponse {
      margin-top: 30px;
      padding: 20px;
      background-color: #f9f9f9;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }
    #webhookResponse h3 {
      margin-bottom: 10px;
      color: #333;
      font-size: 1.5em;
    }
    #responseData {
      font-family: 'Courier New', monospace;
      background-color: #e0e0e0;
      padding: 15px;
      border-radius: 8px;
      overflow-x: auto;
    }
    /* N8N Component Styling */
    n8n-demo {
      --n8n-frame-background-color: #fafafa;
      --n8n-json-background-color: #f0f0f0;
      --n8n-copy-button-background-color: #ccc;
      --n8n-workflow-min-height: 100px;
      --n8n-iframe-border-radius: 15px;
    }
  </style>
</head>
<body>

  <h1>Select and Execute Workflow</h1>

  <!-- Workflow Selection -->
  <div class="workflow-selection">
    <label>
      <input type="checkbox" id="workflow1Checkbox"> Workflow 1
    </label>
    <label>
      <input type="checkbox" id="workflow2Checkbox"> Workflow 2
    </label>
  </div>

  <!-- Workflow 1 -->
  <div id="workflow1" class="workflow-container">
    <h2>Workflow 1</h2>
    <n8n-demo id="workflow1Visualization" workflow='{
      "name": "My workflow",
      "nodes": [
        {
          "parameters": {
            "functionCode": "return items;"
          },
          "name": "Text to JSON6",
          "type": "n8n-nodes-base.function",
          "typeVersion": 1,
          "position": [900, 460],
          "id": "ab512690-f0aa-462a-bebb-c3e30d4678a4"
        },
        {
          "parameters": {
            "requestMethod": "POST",
            "url": "http://default-turninator.amfws.arg.tech/turninator-01",
            "responseFormat": "file",
            "jsonParameters": true,
            "options": {"bodyContentType": "multipart-form-data"},
            "sendBinaryData": true
          },
          "name": "Turninator7",
          "type": "n8n-nodes-base.httpRequest",
          "typeVersion": 1,
          "position": [1320, 460],
          "id": "39a4a837-6a70-461f-9b41-0470a74e7ebe"
        },
        {
          "parameters": {
            "keepOnlySet": "=true",
            "values": {
              "string": [{"name": "text", "value": "={{$json[\"body\"][\"text\"]}}"}],
              "boolean": [{"name": "dialog", "value": true}]
            }
          },
          "name": "Set Dialog Text1",
          "type": "n8n-nodes-base.set",
          "typeVersion": 1,
          "position": [680, 460],
          "id": "b0c724ee-6dc1-402c-bd4d-f874e5cebd82"
        }
      ]
    }' frame="true"></n8n-demo>
  </div>

  <!-- Workflow 2 -->
  <div id="workflow2" class="workflow-container">
    <h2>Workflow 2</h2>
    <n8n-demo id="workflow2Visualization" workflow='{"name": "Workflow 2"}'></n8n-demo>
  </div>

  <!-- User Input Section -->
  <div id="inputBoxContainer">
    <label for="userInput">Enter Text:</label>
    <input type="text" id="userInput" placeholder="Type your input here" />
  </div>

  <!-- Button to Trigger Workflow -->
  <div style="text-align: center; margin-top: 30px;">
    <button id="triggerWebhookButton">Trigger Selected Workflow</button>
  </div>

  <!-- Webhook Response Display -->
  <div id="webhookResponse">
    <h3>Webhook Response</h3>
    <pre id="responseData"></pre>
  </div>

  <script>
    // API keys and webhook URLs
    const apiKey1 = 'n8n_api_fe47230be81cde1fdaa8893f498bddaa96b1a2752ef5278e6bcac0c82cda8ec42c7ecc3e21577dcc';
    const apiKey2 = 'PLACEHOLDER_API_KEY_2';
    const webhookUrl1 = 'http://localhost:5678/webhook/47c193b6-988b-45af-b777-bff42ca01f3b';
    const webhookUrl2 = 'http://localhost:5678/webhook/PLACEHOLDER_URL_2';

    // Function to toggle workflow visibility based on selected checkboxes
    function toggleWorkflows() {
      const isWorkflow1Selected = document.getElementById('workflow1Checkbox').checked;
      const isWorkflow2Selected = document.getElementById('workflow2Checkbox').checked;

      document.getElementById('workflow1').style.display = isWorkflow1Selected ? 'block' : 'none';
      document.getElementById('workflow2').style.display = isWorkflow2Selected ? 'block' : 'none';
    }

    // Trigger webhook when button is clicked
    document.getElementById('triggerWebhookButton').addEventListener('click', () => {
      const userInput = document.getElementById('userInput').value.trim();
      if (!userInput) {
        alert("Please enter text before triggering the workflow.");
        return;
      }

      const selectedWorkflow = document.getElementById('workflow1Checkbox').checked ? webhookUrl1 : webhookUrl2;

      // Send data to selected workflow via fetch
      fetch(selectedWorkflow, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + (selectedWorkflow === webhookUrl1 ? apiKey1 : apiKey2),
        },
        body: JSON.stringify({ input: userInput }),
      })
        .then(response => response.json())
        .then(data => {
          document.getElementById('responseData').textContent = JSON.stringify(data, null, 2);
        })
        .catch(error => {
          console.error('Error:', error);
        });
    });

    // Watch for changes in checkbox status
    document.getElementById('workflow1Checkbox').addEventListener('change', toggleWorkflows);
    document.getElementById('workflow2Checkbox').addEventListener('change', toggleWorkflows);

    // Initial call to set the state of workflows
    toggleWorkflows();
  </script>

</body>
</html>
