<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>n8n Webhook Trigger</title>
    <script type="module" src="https://cdn.jsdelivr.net/npm/@n8n_io/n8n-demo-component/n8n-demo.bundled.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@webcomponents/webcomponentsjs@2.0.0/webcomponents-loader.js"></script>
<script src="https://www.unpkg.com/lit@2.0.0-rc.2/polyfill-support.js"></script>
<script type="module" src="https://cdn.jsdelivr.net/npm/@n8n_io/n8n-demo-component/n8n-demo.bundled.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
        line-height: 1.6;
      }
      h2, h3 {
        color: #333;
      }
      label {
        font-weight: bold;
      }
      #inputData {
        margin: 10px 0;
        padding: 8px;
        width: 300px;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      button {
        background-color: #007bff;
        color: white;
        border: none;
        padding: 10px 15px;
        cursor: pointer;
        border-radius: 4px;
      }
      button:hover {
        background-color: #0056b3;
      }
      #webhookResponse {
        margin-top: 20px;
        border: 1px solid #ddd;
        padding: 10px;
        width: 100%;
        max-width: 600px;
        background-color: #f9f9f9;
        border-radius: 4px;
        white-space: pre-wrap; /* Preserve formatting for JSON */
        font-family: monospace;
      }
      .error {
        color: red;
      }
    </style>
  </head>
  <body>
    <h2>Trigger n8n Workflow</h2>

    <!-- Input field for user input -->
    <label for="inputData">Enter some data:</label>
    <input type="text" id="inputData" name="text" placeholder="Type something..." />

    <!-- Button to trigger webhook -->
    <button id="triggerWebhookButton">Trigger n8n Workflow</button>

    <!-- Section to display the raw webhook response -->
    <h3>Webhook Response:</h3>
    <div id="webhookResponse">
      <em>No response yet</em>
    </div>

    
    <!-- Section to display the n8n Workflow using the custom web component -->
    <h3>n8n Workflow Preview:</h3>

    <n8n-demo workflow='{"nodes":[{"name":"Workflow-Created","type":"n8n-nodes-base.webhook","position":[512,369],"parameters":{"path":"webhook","httpMethod":"POST"},"typeVersion":1}],"connections":{}}'></n8n-demo>

    <n8n-demo-component
      workflow-id="24"
      n8n-url="https://n8n-new.arg.tech/"
      style="width: 100%; height: 600px; border: 1px solid #ccc"
      id="workflowPreview"
    ></n8n-demo-component>

    <script>
      // Your API key for authentication (replace with actual key)
      const apiKey = 'n8n_api_fe47230be81cde1fdaa8893f498bddaa96b1a2752ef5278e6bcac0c82cda8ec42c7ecc3e21577dcc';

      // Function to handle the button click and trigger the webhook
      document.getElementById('triggerWebhookButton').addEventListener('click', () => {
        // Get user input
        const userInput = document.getElementById('inputData').value.trim();

        // Validate input
        if (!userInput) {
          alert('Please enter some data.');
          return;
        }

        // Make the POST request to the webhook
        fetch('http://localhost:5678/webhook/47c193b6-988b-45af-b777-bff42ca01f3b', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-N8N-API-KEY': apiKey,
          },
          body: JSON.stringify({ text: userInput }),
        })
          .then((response) => {
            if (!response.ok) {
              throw new Error(`HTTP error! Status: ${response.status}`);
            }
            return response.json();
          })
          .then((data) => {
            console.log('Webhook Response:', data);

            // Display the raw JSON response
            const responseDiv = document.getElementById('webhookResponse');
            responseDiv.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
          })
          .catch((error) => {
            console.error('Error triggering webhook:', error);

            // Display the error message in the raw response div
            const responseDiv = document.getElementById('webhookResponse');
            responseDiv.innerHTML = `<span class="error">Error: ${error.message}</span>`;
          });
      });
    </script>
  </body>
</html>
