<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workflow Executor</title>
    <script type="module" src="https://cdn.jsdelivr.net/npm/@n8n_io/n8n-demo-component/n8n-demo.bundled.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@webcomponents/webcomponentsjs@2.0.0/webcomponents-loader.js"></script>
    <script src="https://www.unpkg.com/lit@2.0.0-rc.2/polyfill-support.js"></script>
    <style>
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f4f4f9;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .container {
        background: #fff;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        max-width: 800px;
        width: 100%;
      }

      h1 {
        font-size: 1.8rem;
        color: #333;
        margin-bottom: 20px;
        text-align: center;
      }

      label {
        font-size: 1.1rem;
        display: block;
        margin: 20px 0 10px;
        color: #555;
      }

      #inputData {
        padding: 12px;
        width: 100%;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 1rem;
        margin-bottom: 20px;
      }

      button {
        background-color: #28a745;
        color: white;
        border: none;
        padding: 12px 20px;
        font-size: 1rem;
        cursor: pointer;
        border-radius: 8px;
        transition: background-color 0.3s ease;
        display: block;
        width: 100%;
      }

      button:hover {
        background-color: #218838;
      }

      #webhookResponse {
        margin-top: 30px;
        padding: 20px;
        border: 1px solid #ddd;
        border-radius: 8px;
        background-color: #f8f9fa;
        white-space: pre-wrap;
        text-align: left;
        font-family: 'Courier New', Courier, monospace;
        color: #444;
      }

      .error {
        color: red;
      }

      .workflow-preview {
        margin-top: 30px;
        text-align: center;
      }

      .workflow-preview h3 {
        font-size: 1.4rem;
        color: #333;
        margin-bottom: 15px;
      }

      .workflow-preview n8n-demo {
        display: block;
        margin: 0 auto;
        border: 1px solid #ddd;
        border-radius: 8px;
        overflow: hidden;
      }
  
      n8n-demo {
        --n8n-frame-background-color: black;
        --n8n-json-background-color: lightgray;
        --n8n-copy-button-background-color: gray;
        --n8n-workflow-min-height: 100px;
        --n8n-iframe-border-radius: 30px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>n8n Workflow Executor</h1>

      <!-- Dropdown to select workflow -->
      <label for="workflowSelect">Select Workflow:</label>
      <select id="workflowSelect" name="workflowSelect">
        <option value="workflow1">Workflow 1</option>
        <option value="workflow2">Workflow 2</option>
      </select>

      <!-- Input field for user input -->
      <label for="inputData">Input Argument:</label>
      <input type="text" id="inputData" name="text" placeholder="Enter your data here..." />

      <!-- Button to trigger webhook -->
      <button id="triggerWebhookButton">Run Workflow</button>

      <!-- Section to display the raw webhook response -->
      <div id="webhookResponse">
        <em>Awaiting response...</em>
      </div>

      <!-- Section to display the n8n Workflow using the custom web component -->
      <div class="workflow-preview">
        <h3>Workflow Visualization</h3>
        <n8n-demo id="workflowVisualization" workflow='{"name": "Workflow 1"}' frame="true"></n8n-demo>
      </div>

      <!-- Webhook API Key and URL -->
      <div id="webhookDetails">
        <p><strong>Webhook API Key:</strong> <span id="webhookApiKey">n8n_api_fe47230be81cde1fdaa8893f498bddaa96b1a2752ef5278e6bcac0c82cda8ec42c7ecc3e21577dcc</span></p>
        <p><strong>Webhook URL:</strong> <span id="webhookUrl">http://localhost:5678/webhook/47c193b6-988b-45af-b777-bff42ca01f3b</span></p>
      </div>
    </div>

    <script>
      // Your API key for authentication (replace with actual key)
      const apiKey1 = 'n8n_api_fe47230be81cde1fdaa8893f498bddaa96b1a2752ef5278e6bcac0c82cda8ec42c7ecc3e21577dcc';
      const apiKey2 = 'PLACEHOLDER_API_KEY_2';
      const webhookUrl1 = 'http://localhost:5678/webhook/47c193b6-988b-45af-b777-bff42ca01f3b';
      const webhookUrl2 = 'http://localhost:5678/webhook/PLACEHOLDER_URL_2';

      // Function to update the workflow and webhook details
      function updateWorkflowAndWebhook(selectedWorkflow) {
        const workflowElement = document.getElementById('workflowVisualization');
        const webhookApiKeyElement = document.getElementById('webhookApiKey');
        const webhookUrlElement = document.getElementById('webhookUrl');

        if (selectedWorkflow === 'workflow1') {
          workflowElement.setAttribute('workflow', '{"name":"My workflow","nodes":[{"parameters":{"functionCode":"return items;"},"name":"Text to JSON6","type":"n8n-nodes-base.function","typeVersion":1,"position":[900,460],"id":"ab512690-f0aa-462a-bebb-c3e30d4678a4"},{"parameters":{"requestMethod":"POST","url":"http://default-turninator.amfws.arg.tech/turninator-01","responseFormat":"file","jsonParameters":true,"options":{"bodyContentType":"multipart-form-data"},"sendBinaryData":true},"name":"Turninator7","type":"n8n-nodes-base.httpRequest","typeVersion":1,"position":[1320,460],"id":"39a4a837-6a70-461f-9b41-0470a74e7ebe"},{"parameters":{"keepOnlySet":"=true","values":{"string":[{"name":"text","value":"={{$json["body"]["text"]}}"},{"name":"AIF","value":"{}"}],"boolean":[{"name":"dialog","value":true}]},"options":{}},"name":"Set Dialog Text1","type":"n8n-nodes-base.set","typeVersion":1,"position":[680,460],"id":"b0c724ee-6dc1-402c-bd4d-f874e5cebd82"},{"parameters":{"requestMethod":"POST","url":"http://default-proposition-unitiser.amfws.arg.tech/propositionUnitizer-01","responseFormat":"file","jsonParameters":true,"options":{"bodyContentType":"multipart-form-data"},"sendBinaryData":true},"name":"Propositionalizer4","type":"n8n-nodes-base.httpRequest","typeVersion":1,"position":[1760,460],"id":"13972aa8-d3a2-46f4-b442-3d59dc052985"},{"parameters":{"requestMethod":"POST","url":"http://default-segmenter.amfws.arg.tech/segmenter-01","responseFormat":"file","jsonParameters":true,"options":{"bodyContentType":"multipart-form-data"},"sendBinaryData":true},"name":"Segmenter7","type":"n8n-nodes-base.httpRequest","typeVersion":1,"position":[1540,460],"id":"11e77002-e40c-47d8-918e-c326bfe61478"},{"parameters":{"requestMethod":"POST","url":"http://bert-te.amfws.arg.tech/bert-te","responseFormat":"file","jsonParameters":true,"options":{"bodyContentType":"multipart-form-data"},"sendBinaryData":true},"name":"bert-te5","type":"n8n-nodes-base.httpRequest","typeVersion":1,"position":[200           webhookApiKeyElement.textContent = apiKey1;
          webhookUrlElement.textContent = webhookUrl1;
        } else if (selectedWorkflow === 'workflow2') {
          workflowElement.setAttribute('workflow', '{"name": "Workflow 2"}');
          webhookApiKeyElement.textContent = apiKey2;
          webhookUrlElement.textContent = webhookUrl2;
        }
      }

      // Event listener for workflow selection change
      document.getElementById('workflowSelect').addEventListener('change', (event) => {
        updateWorkflowAndWebhook(event.target.value);
      });

      // Function to handle the button click and trigger the webhook
      document.getElementById('triggerWebhookButton').addEventListener('click', () => {
        // Get user input
        const userInput = document.getElementById('inputData').value.trim();

        // Validate input
        if (!userInput) {
          alert('Please enter valid input.');
          return;
        }

        // Get the selected workflow
        const selectedWorkflow = document.getElementById('workflowSelect').value;

        // Make the POST request to the selected workflow's webhook URL
        const selectedWebhookUrl = selectedWorkflow === 'workflow1' ? webhookUrl1 : webhookUrl2;
        const selectedApiKey = selectedWorkflow === 'workflow1' ? apiKey1 : apiKey2;

        fetch(selectedWebhookUrl, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-N8N-API-KEY': selectedApiKey,
          },
          body: JSON.stringify({ text: userInput }),
        })
          .then((response) => {
            if (!response.ok) {
              throw new Error(`HTTP error! Status: ${response.status}`);
            }
            return response.json();
          })
          .then((data) => {
            console.log('Webhook Response:', data);

            // Display the raw JSON response
            const responseDiv = document.getElementById('webhookResponse');
            responseDiv.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
          })
          .catch((error) => {
            console.error('Error triggering webhook:', error);

            // Display the error message in the raw response div
            const responseDiv = document.getElementById('webhookResponse');
            responseDiv.innerHTML = `<span class="error">Error: ${error.message}</span>`;
          });
      });
    </script>
  </body>
</html>
