        font-size: 1rem;
        cursor: pointer;
        border-radius: 6px;
        transition: background-color 0.3s ease;
      }

      button:hover {

      #webhookResponse {

        border: 1px solid #ddd;
        border-radius: 6px;
        background-color: #f9f9f9;
        white-space: pre-wrap;
        text-align: left;
        font-family: 'Courier New', Courier, monospace;

      <h2>Trigger n8n Workflow</h2>

      <!-- Input field for user input -->
      <label for="inputData">Enter some data:</label>
      <input type="text" id="inputData" name="text" placeholder="Type something..." />

      <!-- Button to trigger webhook -->
      <button id="triggerWebhookButton">Trigger n8n Workflow</button>

      <!-- Section to display the raw webhook response -->
      <h3>Webhook Response:</h3>
      <div id="webhookResponse">
        <em>No response yet</em>
      </div>
    </div>

    <script>
      // Your API key for authentication (replace with actual key)
      const apiKey = 'n8n_api_fe47230be81cde1fdaa8893f498bddaa96b1a2752ef5278e6bcac0c82cda8ec42c7ecc3e21577dcc';

      // Function to handle the button click and trigger the webhook
      document.getElementById('triggerWebhookButton').addEventListener('click', () => {
        // Get user input
        const userInput = document.getElementById('inputData').value.trim();

        // Validate input
        if (!userInput) {
          alert('Please enter some data.');
          return;
        }

        // Make the POST request to the webhook
        fetch('http://localhost:5678/webhook/47c193b6-988b-45af-b777-bff42ca01f3b', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-N8N-API-KEY': apiKey,
          },
          body: JSON.stringify({ text: userInput }),
        })
          .then((response) => {
            if (!response.ok) {
              throw new Error(`HTTP error! Status: ${response.status}`);
            }
            return response.json();
          })
          .then((data) => {
            console.log('Webhook Response:', data);

            // Display the raw JSON response
            const responseDiv = document.getElementById('webhookResponse');
            responseDiv.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
          })
          .catch((error) => {
            console.error('Error triggering webhook:', error);

            // Display the error message in the raw response div
            const responseDiv = document.getElementById('webhookResponse');
            responseDiv.innerHTML = `<span class="error">Error: ${error.message}</span>`;
          });
      });
    </script>
