<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workflow Selection</title>
  <style>
    #workflow1, #workflow2 {
      display: none; /* Initially hide both workflows */
    }
  </style>
</head>
<body>
  <h1>Select and Execute Workflow</h1>

  <!-- Workflow Selection with checkboxes -->
  <div>
    <label>
      <input type="checkbox" id="workflow1Checkbox"> Workflow 1
    </label>
    <label>
      <input type="checkbox" id="workflow2Checkbox"> Workflow 2
    </label>
  </div>

  <!-- Workflow Displays -->
  <div id="workflow1" class="workflow-container">
    <h2>Workflow 1</h2>
    <n8n-demo id="workflow1Visualization" workflow='{"name": "My workflow","nodes":[{"parameters":{"functionCode":"return items;"},"name":"Text to JSON6","type":"n8n-nodes-base.function","typeVersion":1,"position":[900,460],"id":"ab512690-f0aa-462a-bebb-c3e30d4678a4"},{"parameters":{"requestMethod":"POST","url":"http://default-turninator.amfws.arg.tech/turninator-01","responseFormat":"file","jsonParameters":true,"options":{"bodyContentType":"multipart-form-data"},"sendBinaryData":true},"name":"Turninator7","type":"n8n-nodes-base.httpRequest","typeVersion":1,"position":[1320,460],"id":"39a4a837-6a70-461f-9b41-0470a74e7ebe"}]}'>
    </n8n-demo>
  </div>

  <div id="workflow2" class="workflow-container">
    <h2>Workflow 2</h2>
    <n8n-demo id="workflow2Visualization" workflow='{"name": "Workflow 2"}'>
    </n8n-demo>
  </div>

  <button id="triggerWebhookButton">Trigger Selected Workflow</button>

  <div id="webhookResponse">
    <h3>Webhook Response</h3>
    <pre id="responseData"></pre>
  </div>

  <script>
    // Your API keys and webhook URLs
    const apiKey1 = 'n8n_api_fe47230be81cde1fdaa8893f498bddaa96b1a2752ef5278e6bcac0c82cda8ec42c7ecc3e21577dcc';
    const apiKey2 = 'PLACEHOLDER_API_KEY_2';
    const webhookUrl1 = 'http://localhost:5678/webhook/47c193b6-988b-45af-b777-bff42ca01f3b';
    const webhookUrl2 = 'http://localhost:5678/webhook/PLACEHOLDER_URL_2';

    // Function to update the visibility of workflows based on checkbox selection
    function toggleWorkflows() {
      const isWorkflow1Selected = document.getElementById('workflow1Checkbox').checked;
      const isWorkflow2Selected = document.getElementById('workflow2Checkbox').checked;

      // Toggle display of workflow containers based on checkbox state
      document.getElementById('workflow1').style.display = isWorkflow1Selected ? 'block' : 'none';
      document.getElementById('workflow2').style.display = isWorkflow2Selected ? 'block' : 'none';
    }

    // Function to trigger the selected workflow when the button is clicked
    document.getElementById('triggerWebhookButton').addEventListener('click', () => {
      // Get selected workflows
      const isWorkflow1Selected = document.getElementById('workflow1Checkbox').checked;
      const isWorkflow2Selected = document.getElementById('workflow2Checkbox').checked;

      // If neither workflow is selected, alert the user
      if (!isWorkflow1Selected && !isWorkflow2Selected) {
        alert('Please select a workflow to execute.');
        return;
      }

      // Prepare data and URL for the selected workflow
      let selectedWebhookUrl, selectedApiKey;
      if (isWorkflow1Selected) {
        selectedWebhookUrl = webhookUrl1;
        selectedApiKey = apiKey1;
      } else if (isWorkflow2Selected) {
        selectedWebhookUrl = webhookUrl2;
        selectedApiKey = apiKey2;
      }

      // Get user input (if needed for the webhook)
      const userInput = prompt('Enter input for the workflow:', '');

      // Validate user input
      if (!userInput) {
        alert('Please enter valid input.');
        return;
      }

      // Make the POST request to the selected webhook
      fetch(selectedWebhookUrl, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-N8N-API-KEY': selectedApiKey,
        },
        body: JSON.stringify({ text: userInput }),
      })
        .then((response) => {
          if (!response.ok) {
            throw new Error(`HTTP error! Status: ${response.status}`);
          }
          return response.json();
        })
        .then((data) => {
          console.log('Webhook Response:', data);

          // Display the raw JSON response
          const responseElement = document.getElementById('responseData');
          responseElement.textContent = JSON.stringify(data, null, 2);
        })
        .catch((error) => {
          console.error('Error during fetch operation:', error);
        });
    });

    // Add event listeners to checkboxes to toggle workflows
    document.getElementById('workflow1Checkbox').addEventListener('change', toggleWorkflows);
    document.getElementById('workflow2Checkbox').addEventListener('change', toggleWorkflows);

    // Initialize the page with workflows properly toggled
    toggleWorkflows();
  </script>
</body>
</html>
